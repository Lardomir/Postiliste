services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: postiliste
      POSTGRES_USER: postiliste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postiliste-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiliste -d postiliste"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  smtp4dev:
    image: rnwood/smtp4dev:latest
    ports:
      - "${SMTP4DEV_WEB_PORT:-8025}:80"
    restart: unless-stopped

  postiliste:
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile
      target: production
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postiliste:${POSTGRES_PASSWORD}@postgres:5432/postiliste
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: smtp4dev
      SMTP_PORT: 25
      MAIL_FROM: ${MAIL_FROM:-postiliste@example.test}
    depends_on:
      postgres:
        condition: service_healthy
      smtp4dev:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postiliste-postgres:
