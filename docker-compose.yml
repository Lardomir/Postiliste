services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: postiliste
      POSTGRES_USER: postiliste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postiliste}
    volumes:
      - postiliste-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiliste -d postiliste"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postiliste:
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postiliste:${POSTGRES_PASSWORD:-postiliste}@postgres:5432/postiliste
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postiliste-postgres:
